<svg xmlns="http://www.w3.org/2000/svg" >
    <defs>
        <symbol id="warning" viewBox="0 0 200 200">
            <!-- Желтый треугольник предупреждения -->
            <polygon points="100,20 180,160 20,160" fill="#FFCC00" stroke="#CC9900" stroke-width="3"/>
            
            <!-- Восклицательный знак -->
            <rect x="95" y="60" width="10" height="50" rx="5" fill="#663300"/>
            <circle cx="100" cy="130" r="8" fill="#663300"/>
            
            <!-- Внешняя обводка для лучшей видимости -->
            <polygon points="100,20 180,160 20,160" fill="none" stroke="#000000" stroke-width="1" opacity="0.3"/>
        </symbol>
        <symbol id="sun" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="20" fill="#FFD700"/>
            <g stroke="#FFD700" stroke-width="5">
                <line x1="50" y1="25" x2="50" y2="0"/>
                <line x1="50" y1="25" x2="50" y2="0" transform="rotate(45 50 50)"/>
                <line x1="75" y1="50" x2="100" y2="50"/>
                <line x1="75" y1="50" x2="100" y2="50" transform="rotate(45 50 50)"/>
                <line x1="50" y1="75" x2="50" y2="100"/>
                <line x1="50" y1="75" x2="50" y2="100" transform="rotate(45 50 50)"/>
                <line x1="25" y1="50" x2="0" y2="50"/>
                <line x1="25" y1="50" x2="0" y2="50" transform="rotate(45 50 50)"/>
            </g>
        </symbol>
        <symbol id="moon" viewBox="0 0 100 100">
            <g fill="#B19CD9">
                <path d="M 50 0 A 50 50 45 0 0 90 80 M 50 0 A 50 50 1 1 0 90 80" fill-rule="evenodd"></path>
            </g>
        </symbol>
        <symbol id="close-button" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1" fill="none"/>
            <path d="M15 9L9 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M9 9L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </symbol>
    </defs>
</svg>
