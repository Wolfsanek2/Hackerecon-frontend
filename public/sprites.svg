<svg xmlns="http://www.w3.org/2000/svg" >
    <defs>
        <symbol id="warning" viewBox="0 0 200 200">
            <!-- Желтый треугольник предупреждения -->
            <polygon points="100,20 180,160 20,160" fill="currentColor" stroke="#CC9900" stroke-width="0"/>
            
            <!-- Восклицательный знак -->
            <rect x="95" y="60" width="10" height="50" rx="5" fill="#663300"/>
            <circle cx="100" cy="130" r="8" fill="#663300"/>
            
            <!-- Внешняя обводка для лучшей видимости -->
            <polygon points="100,20 180,160 20,160" fill="none" stroke="#000000" stroke-width="1" opacity="0.3"/>
        </symbol>
        <symbol id="sun" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="20" fill="#FFD700"/>
            <g stroke="#FFD700" stroke-width="5">
                <line x1="50" y1="25" x2="50" y2="0"/>
                <line x1="50" y1="25" x2="50" y2="0" transform="rotate(45 50 50)"/>
                <line x1="75" y1="50" x2="100" y2="50"/>
                <line x1="75" y1="50" x2="100" y2="50" transform="rotate(45 50 50)"/>
                <line x1="50" y1="75" x2="50" y2="100"/>
                <line x1="50" y1="75" x2="50" y2="100" transform="rotate(45 50 50)"/>
                <line x1="25" y1="50" x2="0" y2="50"/>
                <line x1="25" y1="50" x2="0" y2="50" transform="rotate(45 50 50)"/>
            </g>
        </symbol>
        <symbol id="moon" viewBox="0 0 100 100">
            <g fill="#B19CD9">
                <path d="M 50 0 A 50 50 45 0 0 90 80 M 50 0 A 50 50 1 1 0 90 80" fill-rule="evenodd"></path>
            </g>
        </symbol>
        <symbol id="close-button" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1" fill="none"/>
            <path d="M15 9L9 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M9 9L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </symbol>
        <symbol id="trash" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 6H5H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8 6V4C8 3.46957 8.21071 2.96086 8.58579 2.58579C8.96086 2.21071 9.46957 2 10 2H14C14.5304 2 15.0391 2.21071 15.4142 2.58579C15.7893 2.96086 16 3.46957 16 4V6M19 6V20C19 20.5304 18.7893 21.0391 18.4142 21.4142C18.0391 21.7893 17.5304 22 17 22H7C6.46957 22 5.96086 21.7893 5.58579 21.4142C5.21071 21.0391 5 20.5304 5 20V6H19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 11V17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 11V17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>
        <symbol id="connection-indicator" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50" fill="currentColor">
        </symbol>
    </defs>
</svg>
